services:
  ollama:
    image: ollama/ollama:0.12.10
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.12.10
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"'
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    stop_grace_period: 6m
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Укажите TELEGRAM_BOT_TOKEN в .env}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?Укажите TELEGRAM_ALLOWED_USER_ID в .env}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:?Укажите X_BEARER_TOKEN в .env}
      DIGEST_INTERVAL_HOURS: ${DIGEST_INTERVAL_HOURS:-12}
      MONTHLY_X_API_BUDGET_USD: ${MONTHLY_X_API_BUDGET_USD:-5}
      X_POST_READ_USD: ${X_POST_READ_USD:-0.005}
      X_USER_READ_USD: ${X_USER_READ_USD:-0.010}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      DATABASE_PATH: ${DATABASE_PATH:-/data/twitter_digest.db}
    volumes:
      - database:/data

volumes:
  database:
  models:
